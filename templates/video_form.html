<!-- Formulaire pour ajouter une vidéo -->

<!DOCTYPE html>
<html>
<head>
    <title>{{ "Modifier la vidéo" if video else "Ajouter une vidéo" }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container py-5">
    <h1 class="mb-4">{{ "Modifier la vidéo" if video else "Ajouter une vidéo" }}</h1>
    <form method="POST" action="">
        <div class="mb-3">
            <label class="form-label">Titre :</label>
            <input type="text" name="title" class="form-control" value="{{ video.title if video else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Description :</label>
            <textarea name="description" class="form-control" required>{{ video.description if video else '' }}</textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">URL :</label>
            <input type="text" name="url" class="form-control" value="{{ video.url if video else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Thème :</label>
            <input type="text" name="theme" class="form-control" value="{{ video.theme if video else '' }}">
        </div>
        <button type="submit" class="btn btn-success">Valider</button>
        <a href="{{ url_for('list_videos') }}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
</body>
</html>
