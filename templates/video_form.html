<!-- Formulaire pour ajouter une vidéo -->

<!DOCTYPE html>
<html>
<head>
    <title>Ajouter une vidéo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4">Ajouter une nouvelle vidéo</h1>
        <form method="POST" action="{{ url_for('add_video') }}">
            <div class="mb-3">
                <label class="form-label">Titre :</label>
                <input type="text" class="form-control" name="title" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Description :</label>
                <textarea class="form-control" name="description" required></textarea>
            </div>
            <button type="submit" class="btn btn-success">Ajouter</button>
            <a href="{{ url_for('list_videos') }}" class="btn btn-secondary">Retour</a>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
