<!-- Formulaire de recherche + résultats -->
<!DOCTYPE html>
<html>

<head>
    <title>Rechercher une vidéo</title>
    <!-- Import Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5">
        <!-- Titre page -->
        <h1 class="mb-4">Rechercher une vidéo</h1>

        <!-- Barre de recherche -->
        <form method="POST" action="{{ url_for('search_video') }}" class="mb-4">
            <div class="input-group">
                <input type="text" class="form-control" name="query" value="{{ query }}" placeholder="Titre de la vidéo">
                <button type="submit" class="btn btn-primary">Rechercher</button>
            </div>
        </form>


        <!-- Si résultat : -->
        {% if results %}
            <h3>Résultats :</h3>
            <ul class="list-group mb-3">
                {% for video in results %}
                    <li class="list-group-item">
                        <a href="{{ url_for('video_detail', id=video.id) }}">{{ video.title }}</a> 
                    </li>
                {% endfor %}
            </ul>

        <!-- Message d'erreur -->
        {% elif query %}
            <p>Aucune vidéo trouvée pour "{{ query }}"</p>
        {% endif %}

        <a href="{{ url_for('list_videos') }}" class="btn btn-secondary me-2">Retour à la liste</a>
        <a href="{{ url_for('home') }}" class="btn btn-secondary">Accueil</a>
    </div>
</body>
</html>
