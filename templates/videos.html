<!-- Liste de toutes les vidéos -->
<!DOCTYPE html>
<html>

<head>
    <title>Liste des vidéos</title>
    <!-- Import Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5">
        <!-- Titre page -->
        <h1 class="mb-4">Liste des vidéos</h1>

        <!-- Titre de chaque vidéos -->
        <div class="list-group mb-3">
            {% for video in videos %}
                <a href="{{ url_for('video_detail', id=video.id) }}" class="list-group-item list-group-item-action">
                    {{ video.title }}
                </a>
            {% endfor %}
        </div>

        <!-- Boutons -->
        <a href="{{ url_for('add_video') }}" class="btn btn-success me-2">Ajouter une vidéo</a>
        <a href="{{ url_for('home') }}" class="btn btn-secondary">Accueil</a>
    </div>
</body>
</html>
