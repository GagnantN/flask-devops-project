<!-- Liste de toutes les vidéos -->
<!DOCTYPE html>
<html>

<head>
    <title>Liste des vidéos</title>
    <!-- Import Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5">
        <!-- Titre + bouton ajouter -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Liste des vidéos</h1>
            <a href="{{ url_for('add_video') }}" class="btn btn-success">Ajouter une vidéo</a>
        </div>

        <!-- Barre de recherche -->
        <form method="POST" action="{{ url_for('search_video') }}" class="mb-4">
            <div class="input-group">
                <input type="text" class="form-control" placeholder="Rechercher par titre..." name="query" value="{{ query if query }}">
                <button type="submit" class="btn btn-primary">Rechercher</button>
            </div>
        </form>

        <!-- Carte bootstrap -->
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            {% for video in videos %}
            <div class="col">

                <div class="card h-100 shadow-sm">
                    <!-- Miniature YouTube -->
                    {% if video.url %}
                        {% set video_id = video.url.split('v=')[-1] %}
                        <img src="https://img.youtube.com/vi/{{ video_id }}/hqdefault.jpg" class="card-img-top" alt="{{ video.title }}">
                    {% else %}
                        <img src="https://via.placeholder.com/480x270?text=Pas+d'image" class="card-img-top" alt="{{ video.title }}">
                    {% endif %}

                    <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{ video.title }}</h5>
                    <p class="card-text">{{ video.description[:100] }}{% if video.description|length > 100 %}...{% endif %}</p>

                    <div class="mt-auto d-flex gap-2">
                        <!-- Boutons Voir et Modifier à gauche -->
                        <div class="d-flex gap-2">
                            <a href="{{ url_for('video_detail', id=video.id) }}" class="btn btn-primary btn-sm">Voir</a>
                            <a href="{{ url_for('edit_video', id=video.id) }}" class="btn btn-warning btn-sm">Modifier</a>
                        </div>

                        <!-- Bouton Supprimer à droite -->
                        <form method="POST" action="{{ url_for('delete_video', id=video.id) }}" class="ms-auto">
                            <button type="submit" class="btn btn-danger btn-sm">Supprimer</button>
                        </form>
                    </div>
                </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
