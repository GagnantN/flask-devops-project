<!-- Détail d'une vidéo + modification / suppression -->

<!DOCTYPE html>
<html>
<head>
    <title>{{ video.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-3">{{ video.title }}</h1>
        <p>{{ video.description }}</p>
        <p><strong>Vues :</strong> {{ video.views }}</p>

        <hr>
        <h3>Modifier la vidéo</h3>
        <form method="POST" action="{{ url_for('video_detail', id=video.id) }}" class="mb-3">
            <input type="hidden" name="_method" value="PUT">
            <div class="mb-3">
                <label class="form-label">Titre :</label>
                <input type="text" class="form-control" name="title" value="{{ video.title }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Description :</label>
                <textarea class="form-control" name="description">{{ video.description }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Modifier</button>
        </form>

        <h3>Supprimer la vidéo</h3>
        <form method="POST" action="{{ url_for('video_detail', id=video.id) }}">
            <input type="hidden" name="_method" value="DELETE">
            <button type="submit" class="btn btn-danger">Supprimer</button>
        </form>

        <div class="mt-3">
            <a href="{{ url_for('list_videos') }}" class="btn btn-secondary me-2">Retour à la liste</a>
            <a href="{{ url_for('home') }}" class="btn btn-secondary">Accueil</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
