<!-- Détail d'une vidéo + modification / suppression -->
<!DOCTYPE html>
<html>

<head>
    <title>Détails de la vidéo</title>
    <!-- Import Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5">
        <!-- Titre page -->
        <h1 class="mb-4">Détails de la vidéo</h1>
        
        <form>
            <!-- Titre -->
            <div class="mb-3">
                <label class="form-label">Titre :</label>
                <input type="text" class="form-control" value="{{ video.title }}" readonly>
            </div>

            <!-- Description -->
            <div class="mb-3">
                <label class="form-label">Description :</label>
                <textarea class="form-control" rows="5" readonly>{{ video.description }}</textarea>
            </div>

            <!-- Url -->
            <div class="mb-3">
                <label class="form-label">URL :</label>
                <input type="text" class="form-control" value="{{ video.url }}" readonly>
            </div>

            <!-- Thème -->
            <div class="mb-3">
                <label class="form-label">Thème :</label>
                <input type="text" class="form-control" value="{{ video.theme }}" readonly>
            </div>
        </form>

        <!-- Boutons actions -->
        <div class="d-flex gap-2 flex-wrap">

            <!-- Voir la vidéo -->
            {% if video.url %}
                <a href="{{ video.url }}" target="_blank" class="btn btn-primary">Voir la vidéo</a>
            {% endif %}

            <!-- Modifier -->
            <a href="{{ url_for('edit_video', id=video.id) }}" class="btn btn-warning">Modifier</a>

            <!-- Supprimer -->
            <form method="POST" action="{{ url_for('delete_video', id=video.id) }}">
                <button type="submit" class="btn btn-danger">Supprimer</button>
            </form>

            <!-- Retour -->
            <a href="{{ url_for('list_videos') }}" class="btn btn-secondary">Retour</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
