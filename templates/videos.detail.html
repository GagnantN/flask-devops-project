<!-- Détail d'une vidéo + modification / suppression -->
<!DOCTYPE html>
<html>

<head>
    <title>Détails de la vidéo</title>
    <!-- Import Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5">
        <!-- Titre page -->
        <h1 class="mb-4">{{ video.title }}</h1>

        <!-- Zone vidéo intégrée -->
        {% if video.url %}
        <div class="ratio ratio-16x9 mb-4">
            <!-- Transforme l'URL YouTube en embed -->
            {% set video_id = video.url.split('v=')[-1] %}
            <iframe src="https://www.youtube.com/embed/{{ video_id }}" 
                    title="{{ video.title }}" allowfullscreen></iframe>
        </div>
        {% endif %}

        <!-- Description -->
        <div class="mb-3">
            <label class="form-label"><strong>Description :</strong></label>
            <p>{{ video.description }}</p>
        </div>

        <!-- Thème -->
        <div class="mb-3">
            <label class="form-label"><strong>Thème :</strong></label>
            <p>{{ video.theme }}</p>
        </div>

        <!-- Boutons actions -->
        <div class="d-flex gap-2 flex-wrap">

            <!-- Modifier -->
            <a href="{{ url_for('edit_video', id=video.id) }}" class="btn btn-warning">Modifier</a>

            <!-- Supprimer -->
            <form method="POST" action="{{ url_for('delete_video', id=video.id) }}">
                <button type="submit" class="btn btn-danger">Supprimer</button>
            </form>

            <!-- Retour -->
            <a href="{{ url_for('list_videos') }}" class="btn btn-secondary">Retour</a>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
